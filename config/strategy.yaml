# =============================================================================
# stock-screener v7.0 策略配置（slim schema，2026-10-22）
#
# 结构（定案，勿增删键）：
#   strategy:   深回撤金字塔加仓参数（9 键，含固定 name）
#   universe:   股票池 5 条件（SOE 恒强制，不设开关）
#   lake:       数据湖配置（lake.config.lake_cfg() 读取；lake-sync 依赖，勿删）
#   datasource: lake-sync 数据源子段（sina/rf/baostock 必留；lake_backfill 唯一消费点）
#
# 纪律：所有策略阈值必须来自本文件（代码零硬编码策略阈值；佣金/印花税为引擎
# 常量，TL 拍板不暴露——martingale/config.py 头部注释）。
#
# 单位约定：带 _pct 的字段存**整数百分数**（15 = 15%），config 层转小数供引擎；
# 金额单位 = 元。
# =============================================================================

strategy:                           # 深回撤金字塔加仓（唯一策略；参数 schema 定案）
  name: drawdown_martingale         # 策略名（固定；Web 只读展示）
  initial_amount: 100000            # 初始投入金额（元）：一次性首仓，占用 k=0 档；
                                    # 每股全策略仅第一次触发用（f6 验收值）
  base_add_amount: 10000            # 加仓基准金额（元）：每轮首档(k=0)；
                                    # 第 k 档 = base_add_amount × growth_ratio^k
  first_drawdown_pct: 15            # 首次回撤比例（%）：hfq ≤ H×(1−15%) 建仓
  add_step_pct: 5                   # 加仓步长（%）：档线 H×(1−first_dd−k×step)
  growth_ratio: 1.1                 # 加仓提升比率：第 k 档 = 基准×比率^k
  rearm_mode: bounce                # 高点再武装模式：bounce（默认）| newhigh
  rearm_pct: 15                     # 高点刷新比例（%）：bounce 模式下价格 ≥ 本周期
                                    # 低点×(1+15%) 时重记高点并重置 k=0
  accounting: cash                  # 会计口径（固定只读：原始价成交+现金分红单列）
  # —— 成本常量（引擎常量，不进本文件/Web，TL 拍板）——
  # comm=3bps 买入 / stamp=5bps 卖出(本策略无卖出→no-op)；改 3bps 则 f6 回归必偏

universe:                           # 股票池（全链 5 条件；漏斗 5556→347→289→125→124→~95）
  industry_whitelist_csric2:        # ① 证监会二级行业白名单（码前缀；已逐一对照实测存在）
    - B06                           # 煤炭开采和洗选业
    - B07                           # 石油和天然气开采业
    - C25                           # 石油、煤炭及其他燃料加工业
    - D44                           # 电力、热力生产和供应业
    - D45                           # 燃气生产和供应业
    - D46                           # 水的生产和供应业
    - G53                           # 铁路运输业
    - G54                           # 道路运输业
    - G55                           # 水上运输业
    - G56                           # 航空运输业
    - I63                           # 电信、广播电视和卫星传输服务
    - J66                           # 货币金融服务（银行）
  soe_keywords:                     # ③ 央国企识别关键词（双规则之二：股东名 LIKE %kw%）
    - 国务院
    - 国资委
    - 汇金
    - 财政部
    - 国资
  min_total_mv_yi: 200              # ④ 总市值下限（亿元，最新估值日）
  min_consecutive_div_years: 5      # ⑤ 连续分红年数下限（老股=最近 N 年；
                                    # 新股=上市次年起全部年度——语义 as-is 移植 v6.x）
  listing_min_trading_days: 250     # ②' 上市满 N 个交易日（K线行数）
  # ② 存活+非ST（delist_date IS NULL AND is_st=0）为固定条件，不设开关

lake:                                 # 数据湖配置（lake.config.lake_cfg() 读取；缺省值见 lake/config.py）
  baostock_daily_budget: 5000       # Q2：BaoStock 日预算上限（次/日，config 可调；到顶当日停、次日续）

datasource:                         # lake-sync 数据源（lake_backfill 经 sina_cfg/rf_cfg 消费；勿删）
  baostock:                         # BaoStock 每日配额守卫（防打穿配额被封禁）
    daily_quota: 49900              # 官网限 50000/日/IP，超限封禁 6h×次数；留 100 余量
  sina:                             # 新浪非官方接口客户端（F10 股东页 + 财务 JSON）
    interval_s: 1.0                 # 请求间隔秒（限速纪律：串行、>=1s）
    timeout_s: 15                   # 单请求超时秒
    max_attempts: 2                 # 重试 <=2 次（含首次共 <=3 次尝试）
    consecutive_fail_breaker: 5     # 某类接口连续失败 >=N 只 → 该类因子整体降级 None
                                    # （missing_policy=neutral_renorm 兜底）+ 报告告警，不得死磕
    cf_reports_num: 20              # 财务 JSON 单次取回报告期数（~5 年季频，足够定位最近年报）
    cooldown_every_n: 15            # WAF 滑动窗口：每 N 次请求插入一次长冷却
    cooldown_s: 20                  # 长冷却秒数（让 WAF 滑动窗口在饱和前复位）
    waf_backoff_s: 30               # HTTP 456 专用重试退避秒（短退避无效，WAF 需要时间复位）
  rf:                               # 10Y 国债收益率源 = TradingEconomics
    url: "https://tradingeconomics.com/china/government-bond-yield"
    fallback_pct: 2.0               # 页面解析失败时的回退值（%）+ 告警不静默
    sanity_pct: [0.5, 4.0]          # sanity 区间（越界告警不静默；防页面改版漂移）
