# stream04l4.duckdns.org — 双系统 HTTPS 单域名入口（v7.0.44，2026-11-11）
#
#   https://stream04l4.duckdns.org/        → 127.0.0.1:9090 股票系统
#   https://stream04l4.duckdns.org/crypto/ → 127.0.0.1:9091 加密货币系统（前缀透传不剥）
#
# 证书：Let's Encrypt（tls-alpn-01 签发，仅 443 可用；80 未开）。
# 续期：certbot standalone 需要 443 空闲 → 续期 pre/post 钩子自动腾挪
#       （/usr/local/sbin/ssl443-pre|post + 5 分钟看门狗兜底），8888 LLM 反代不受影响。
server {
    listen 443 ssl http2;
    server_name stream04l4.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/stream04l4/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stream04l4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;
    access_log /var/log/nginx/stream04l4.access.log;
    error_log  /var/log/nginx/stream04l4.error.log;

    # ── 股票系统（根路径）────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE（回测事件流）+ WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 加密货币系统（/crypto/ 前缀透传，不剥前缀——后端原生带前缀）──
    location /crypto/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
