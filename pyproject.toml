[project]
name = "stock-screener"
version = "0.1.0"
description = "A股选股策略程序：技术面 + 股息率 + 行业内排名 + 基本面四维筛选（主数据源 BaoStock）"
requires-python = ">=3.10,<3.11"
dependencies = [
    "baostock>=0.8.9",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.17",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# v5.2 Phase 1：akshare 校验源（**pin 死版本**——非官方接口、迭代快，漂移风险高；
# 仅交叉校验用途，不进主计算路径。装法：uv pip install 'akshare==1.18.88'）
validate = ["akshare==1.18.88"]
# v6 数据湖（独立分析层，非筛选热路径）：DuckDB 单文件库 + Parquet(zstd) 导出。
# 不进主依赖——未装时 web 页签显示"数据湖未安装"，主路径行为逐字节不变（Q9）。
lake = ["duckdb>=1.5,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screener", "lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
