[project]
name = "stock-screener"
version = "7.0.0"
description = "A股深回撤金字塔加仓策略（drawdown_martingale）：5 条件股票池 + 逐股状态机回测 + Web 查询/按需回测（数据源 = DuckDB 数据湖）"
requires-python = ">=3.10,<3.11"
dependencies = [
    "baostock>=0.8.9",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.17",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# v5.2 Phase 1：akshare 校验源（**pin 死版本**——非官方接口、迭代快，漂移风险高；
# 仅交叉校验用途，不进主计算路径。装法：uv pip install 'akshare==1.18.88'）
validate = ["akshare==1.18.88"]
# 数据湖：DuckDB 单文件库 + Parquet(zstd) 导出。martingale 包与 lake 同依赖 duckdb
# （martingale/data.py read_only 连接 lake.duckdb）；本部署 venv 已装，未装时
# `python -m martingale` 报 LakeMissing/LakeInvalidFile 类错误。
lake = ["duckdb>=1.5,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screener", "lake", "martingale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
