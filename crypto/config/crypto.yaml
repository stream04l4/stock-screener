# 加密货币系统配置（v7.0.43 框架）。
# 数据源：Binance 主源 + OKX 交叉校验（2026-11-11 EU 直连实测全通，均无需 key）。
# 本文件是加密货币系统的唯一配置入口（对应股票侧 config/strategy.yaml 的角色）。

web:
  host: "0.0.0.0"
  port: 9091              # 沿用旧 Quant 塔端口（已验证空闲）

lake:
  # 加密货币系统数据独立目录（data/crypto/，与 A 股 data/ 其余内容完全隔离）
  path: "data/crypto/crypto.duckdb"
  state_file: "data/crypto/sync_state.json"   # 最近同步状态（数据湖 tab 展示）

source:
  primary: binance        # 切备源：改 primary: okx（1 行）
  backup: okx
  timeout_s: 10
  cross_check: true       # 每次同步比对两源最近 24h 收盘价
  cross_check_warn_pct: 0.1

sync:
  interval: "1h"          # 基础 K 线粒度（4h/1d 由 1h 本地聚合，不单独取数）
  backfill_window_h: 3    # 日常增量回补窗口（自愈漏同步/交易所补发）
  backfill_start: "2019-01-01"   # REST 增量起点（--full 历史段走 vision 快照，不受此限）
  request_pause_s: 0.15   # 批量请求间隔（限速余量 >99%）

# 全量历史回填源：Binance 官方月度快照 data.binance.vision（月末才发布当月；
# 当月+尾巴走 REST 补齐）。参考 quant_iTransformer historical_pipeline
# build_main_features.py 的月度 ZIP + 沙盒缓存 + 403/429 退避模式。
vision:
  enabled: true
  probe_start_ym: "2017-08"   # 自动探测每币首个可用月份（404 → 下月，实测 BTC/ETH 2017-08 起、SOL 2020-08 起）
  workers: 4                  # 并发下载线程数
  cache_dir: "data/crypto/vision_cache"   # 月度 CSV 沙盒缓存（不入库）

# 币种清单（Binance USDT 现货）。v7.0.45 聚焦三标的（Joel 2026-11-11 定案）；
# v7.0.52 SOL 退役；v8.0.6 ETH 退役（Joel 2026-11-11）→ 只保留 BTC。
# 增删 = 改这里重跑 sync 即可。
coins:
  - BTCUSDT
# 退役清单（v7.0.43 top20 其余 17 币 + v7.0.52 SOL + v8.0.6 ETH，停用：湖里数据保留、
# coin_master.is_active=FALSE；恢复 = 加回 coins 重跑 sync）：
# ETHUSDT SOLUSDT BNBUSDT XRPUSDT ADAUSDT DOGEUSDT AVAXUSDT LINKUSDT DOTUSDT
# LTCUSDT BCHUSDT TRXUSDT NEARUSDT POLUSDT ATOMUSDT UNIUSDT XLMUSDT ETCUSDT VETUSDT

# 马丁格尔策略（v7.0.47，Joel 2026-11-11 规格 + 两个决策门拍板）：
# 1 建仓=价≤一年高点×30%（跌70%）首仓 10 USDT；2 加仓=建仓价×(1−1%×k) 网格、
# 第 k 级 10×1.05^k USDT 不设上限；3 上涨不加仓/新高不刷新建仓价；
# 4 止盈=价≥建仓价×10 全卖、entry 重置进入下一轮。
# 引擎：crypto/strategy/engine.py；回测：python -m crypto.backtest
strategy:
  first_drop_pct: 70        # 建仓触发 = 一年高点 × (1 − 70%) = 30%（决策门1）
  add_grid_pct: 1           # 加仓级距 = 建仓价的 1%/级（固定网格，不设上限）
  base_amount_usdt: 10      # 初始建仓金额（USDT）
  growth: 1.05              # 每次加仓 × 1.05
  take_profit_mult: 10      # 止盈 = 建仓价 × 10（决策门2：确认 10 倍）
  fee_bps: 10               # taker 手续费 10bps（Binance 现货 0.1%；0=关闭）
  lookback_h: 8760          # 一年高点 = 滚动 365 天收盘价最大（含当日 bar）
